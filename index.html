<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Riddim">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<title>Riddim</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous">
<link rel="stylesheet" href="style.css?v=4a1">
</head>
<body>

<!-- Connexion -->
<section id="ecran-connexion" hidden>
  <h1>Riddim</h1>
  <div class="bande" aria-hidden="true"><span></span><span></span><span></span></div>
  <form id="form-connexion" novalidate>
    <label>E-mail
      <input id="connexion-email" type="email" autocomplete="username" inputmode="email" required>
    </label>
    <label>Mot de passe
      <input id="connexion-mdp" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="bouton-principal" id="bouton-connexion">Se connecter</button>
    <p id="connexion-erreur" class="erreur" role="alert"></p>
  </form>
</section>

<!-- Écran sans accès (compte connecté mais pas membre) -->
<section id="ecran-sans-acces" hidden>
  <h1>Pas d'accès</h1>
  <p>Ce compte n'a pas encore accès à l'appli. Demande à Emma de l'ajouter.</p>
  <button type="button" class="bouton-secondaire" id="bouton-deconnexion-sans-acces">Se déconnecter</button>
</section>

<!-- Appli -->
<div id="appli" hidden>
  <main id="contenu"></main>
  <div id="bandeau" role="status" hidden></div>
  <nav id="barre" aria-label="Onglets"></nav>
</div>

<!-- Feuilles plein écran (fiches et formulaires) -->
<div id="feuilles"></div>

<!-- Messages courts -->
<div id="message" role="status" aria-live="polite"></div>

<script src="config.js?v=4a1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
        integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>
<script src="app.js?v=4a1"></script>
<script src="steps.js?v=4a1"></script>
<script src="createurs.js?v=4a1"></script>
<script src="carte.js?v=4a1"></script>
<script src="cours.js?v=4a1"></script>
<script src="savoir.js?v=4a1"></script>
</body>
</html>
